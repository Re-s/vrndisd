name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      # Windows / Android 涉及 cgo-free syscall 与 embed，单独验证编译。
      - name: Build (windows)
        run: GOOS=windows GOARCH=amd64 go build ./...
      - name: Build (android)
        run: GOOS=android GOARCH=arm64 go build ./...
      - name: Test
        run: go test ./...
